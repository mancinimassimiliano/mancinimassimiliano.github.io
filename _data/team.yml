# Team members, shown on /team/ and (current members only) on the home page.
# Members and alumni are sorted alphabetically by first name automatically, so the
# order in this file does not matter.
#
# Per-member fields (only `name` and `group` are required):
#   name:        Full name
#   group:       one of the ids listed under `groups` below
#   role:        Text shown under the name (defaults to the group's `role`)
#   affiliation: String or list of strings. Defaults to `default_affiliation`.
#                Names listed under `affiliations` become links.
#   coadvisor:   Co-supervisor, e.g. "Elisa Ricci"
#   since:       Start year, e.g. 2024
#   photo:       File in assets/img/team/ (square works best). Initials are shown if missing.
#   url:         Personal website (the name links here)
#   scholar:     Google Scholar URL
#   linkedin:    LinkedIn URL
#   home:        false to hide this person from the home-page strip

default_affiliation: University of Trento

# Affiliation name -> link. Add new institutions here.
affiliations:
  University of Trento: https://www.unitn.it
  University of Twente: https://www.utwente.nl
  Fondazione Bruno Kessler: https://www.fbk.eu

# Display order and titles of the groups on /team/. Empty groups are hidden.
groups:
  - id: postdoc
    title: postdocs
    role: Postdoc
  - id: phd
    title: phd students
    role: PhD student
  - id: visiting
    title: visiting researchers
    role: Visiting researcher
  - id: msc
    title: msc students
    role: MSc student

